<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background & Neon Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <linearGradient id="cyber-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00ff66" />
    </linearGradient>

    <linearGradient id="blade-gleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2634" />
      <stop offset="45%" stop-color="#4a6572" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#4a6572" />
      <stop offset="100%" stop-color="#0f1923" />
    </linearGradient>

    <linearGradient id="red-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 0, 85, 0)" />
      <stop offset="50%" stop-color="rgba(255, 0, 85, 0.85)" />
      <stop offset="100%" stop-color="rgba(255, 0, 85, 0)" />
    </linearGradient>

    <linearGradient id="green-scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 255, 102, 0)" />
      <stop offset="50%" stop-color="rgba(0, 255, 102, 0.4)" />
      <stop offset="100%" stop-color="rgba(0, 255, 102, 0)" />
    </linearGradient>

    <!-- Filters for Cyber Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="eye-flare" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="flare" />
      <feMerge>
        <feMergeNode in="flare" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00ff66" stroke-width="0.3" stroke-opacity="0.12" />
      <circle cx="0" cy="0" r="1" fill="#00e5ff" fill-opacity="0.25" />
    </pattern>

    <style>
      @keyframes scanline {
        0% { transform: translateY(-30px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(290px); opacity: 0; }
      }

      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes visorPulse {
        0%, 100% { fill: #00ff66; filter: drop-shadow(0 0 6px #00ff66); }
        33% { fill: #00e5ff; filter: drop-shadow(0 0 8px #00e5ff); }
        66% { fill: #ff0055; filter: drop-shadow(0 0 8px #ff0055); }
      }

      @keyframes katanaSlash {
        0% { transform: translateX(-150px) translateY(-150px); opacity: 0; }
        40% { opacity: 1; }
        60% { opacity: 1; }
        100% { transform: translateX(250px) translateY(250px); opacity: 0; }
      }

      @keyframes glitchText {
        0%, 92%, 100% { transform: translate(0, 0); text-shadow: 0 0 8px #00ff66; }
        93% { transform: translate(-2px, 1px); text-shadow: -2px 0 #ff0055, 2px 0 #00e5ff; }
        95% { transform: translate(2px, -1px); text-shadow: 2px 0 #00e5ff, -2px 0 #ff0055; }
        97% { transform: translate(0, 0); text-shadow: 0 0 12px #00ff66; }
      }

      @keyframes matrixCol1 {
        0% { transform: translateY(-80px); opacity: 0; }
        50% { opacity: 0.45; }
        100% { transform: translateY(280px); opacity: 0; }
      }

      @keyframes matrixCol2 {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.35; }
        100% { transform: translateY(260px); opacity: 0; }
      }

      @keyframes hudBlink {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.2; }
      }

      .scanline-bar {
        animation: scanline 4.5s ease-in-out infinite;
      }
      .radar-sweep {
        transform-origin: 770px 130px;
        animation: radarRotate 6s linear infinite;
      }
      .ninja-eye {
        animation: visorPulse 4s ease-in-out infinite;
      }
      .glitch-title {
        animation: glitchText 3.5s infinite;
      }
      .col-1 { animation: matrixCol1 4s linear infinite; }
      .col-2 { animation: matrixCol2 5s linear 1.2s infinite; }
      .col-3 { animation: matrixCol1 4.5s linear 2s infinite; }
      .hud-indicator { animation: hudBlink 1.5s ease-in-out infinite; }
      .corner-pulse { animation: hudBlink 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="880" height="260" rx="14" fill="url(#bg-grad)" />
  <rect width="880" height="260" rx="14" fill="url(#cyber-grid)" />

  <!-- Outer Neon Border with Cyber Chamfers -->
  <rect x="2" y="2" width="876" height="256" rx="12" fill="none" stroke="#00ff66" stroke-width="1.2" stroke-opacity="0.4" />
  <rect x="6" y="6" width="868" height="248" rx="10" fill="none" stroke="#00e5ff" stroke-width="0.6" stroke-opacity="0.2" />

  <!-- Cyber Matrix Stream Columns (Background Ambience) -->
  <g font-family="monospace" font-size="10" fill="#00ff66" opacity="0.35">
    <g class="col-1">
      <text x="35" y="20">01</text>
      <text x="35" y="38">AF</text>
      <text x="35" y="56">10</text>
      <text x="35" y="74">C8</text>
      <text x="35" y="92">99</text>
      <text x="35" y="110">7B</text>
      <text x="35" y="128">00</text>
      <text x="35" y="146">FF</text>
    </g>
    <g class="col-2">
      <text x="65" y="15">N</text>
      <text x="65" y="33">I</text>
      <text x="65" y="51">N</text>
      <text x="65" y="69">J</text>
      <text x="65" y="87">A</text>
      <text x="65" y="105">_</text>
      <text x="65" y="123">X</text>
    </g>
    <g class="col-3">
      <text x="825" y="20">77</text>
      <text x="825" y="38">E4</text>
      <text x="825" y="56">9A</text>
      <text x="825" y="74">01</text>
      <text x="825" y="92">DE</text>
      <text x="825" y="110">F9</text>
      <text x="825" y="128">5C</text>
    </g>
    <g class="col-2">
      <text x="848" y="25">R</text>
      <text x="848" y="43">O</text>
      <text x="848" y="61">O</text>
      <text x="848" y="79">T</text>
      <text x="848" y="97">#</text>
    </g>
  </g>

  <!-- Left: Cyber Shinobi Mask & Katana Emblem -->
  <g transform="translate(100, 130)">
    <!-- Katana Blades in X Behind Mask -->
    <path d="M -75 -65 L 75 65" stroke="url(#blade-gleam)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 75 -65 L -75 65" stroke="url(#blade-gleam)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Katana Tsuka (Handles) & Tsuba (Guards) -->
    <rect x="-82" y="-72" width="10" height="10" fill="#00ff66" stroke="#04060c" stroke-width="1.5" />
    <rect x="72" y="-72" width="10" height="10" fill="#00ff66" stroke="#04060c" stroke-width="1.5" />

    <!-- Shinobi Helmet Hood Base -->
    <path d="M -45 35 C -48 10 -40 -35 0 -45 C 40 -35 48 10 45 35 C 32 50 15 55 0 55 C -15 55 -32 50 -45 35 Z"
          fill="#0c121e" stroke="#00e5ff" stroke-width="2" />

    <!-- Carbon Fiber Inner Faceplate Mask -->
    <path d="M -35 10 L -25 -18 L 0 -22 L 25 -18 L 35 10 L 22 40 L 0 46 L -22 40 Z"
          fill="#05080e" stroke="#00ff66" stroke-width="1.5" />

    <!-- Cyber Ventilation Grille -->
    <line x1="-14" y1="22" x2="14" y2="22" stroke="#00ff66" stroke-width="1" stroke-opacity="0.6" />
    <line x1="-10" y1="28" x2="10" y2="28" stroke="#00ff66" stroke-width="1" stroke-opacity="0.6" />
    <line x1="-6" y1="34" x2="6" y2="34" stroke="#00ff66" stroke-width="1" stroke-opacity="0.6" />

    <!-- Ninja Visor Eyes (Angled, Aggressive, Glowing) -->
    <path class="ninja-eye" d="M -26 -3 L -6 -7 L -8 -1 L -24 3 Z" />
    <path class="ninja-eye" d="M 26 -3 L 6 -7 L 8 -1 L 24 3 Z" />

    <!-- Forehead Cyber Shuriken Crest -->
    <polygon points="0,-38 5,-28 15,-28 7,-20 10,-10 0,-16 -10,-10 -7,-20 -15,-28 -5,-28"
             fill="#00ff66" filter="url(#eye-flare)" opacity="0.9" />

    <!-- Reticle Outer Circle Orbit -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#00e5ff" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.4" />
  </g>

  <!-- Center: Elite Hacker Identity & Tactical HUD Info -->
  <g transform="translate(225, 0)">
    <!-- Top System Telemetry Bar -->
    <g transform="translate(0, 36)" font-family="'Courier New', monospace" font-size="10.5">
      <!-- Status Badge -->
      <rect x="0" y="0" width="135" height="20" rx="4" fill="#00ff66" fill-opacity="0.12" stroke="#00ff66" stroke-width="1" />
      <circle cx="12" cy="10" r="3.5" fill="#00ff66" class="hud-indicator" />
      <text x="24" y="14" fill="#00ff66" font-weight="bold">SYSTEM: ARMED</text>

      <rect x="145" y="0" width="155" height="20" rx="4" fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff" stroke-width="0.8" />
      <text x="156" y="14" fill="#00e5ff">CLEARANCE: LEVEL 5</text>

      <rect x="310" y="0" width="165" height="20" rx="4" fill="#ff0055" fill-opacity="0.08" stroke="#ff0055" stroke-width="0.8" />
      <text x="320" y="14" fill="#ff0055">THREAT: OFFENSIVE</text>
    </g>

    <!-- Main Operative Name with Cyber Glitch -->
    <g transform="translate(0, 95)">
      <text class="glitch-title" font-family="'Segoe UI', 'Ubuntu', 'Consolas', sans-serif" font-weight="900" font-size="34" letter-spacing="2.5" fill="#ffffff">
        FAIZAN UL HASSAN
      </text>
      <!-- Sub-Handle -->
      <text x="3" y="28" font-family="'Courier New', monospace" font-weight="bold" font-size="15" fill="#00ff66" letter-spacing="4">
        &lt;<tspan fill="#00e5ff">DEF-WARRIOR</tspan>&gt; // SHADOW SHINOBI
      </text>
    </g>

    <!-- Tactical Specialty Subtitle -->
    <g transform="translate(0, 160)" font-family="'Courier New', monospace" font-size="12">
      <path d="M 0 0 L 460 0" stroke="#00e5ff" stroke-width="1" stroke-dasharray="10 4" opacity="0.4" />
      <text x="0" y="20" fill="#a0aec0">
        ⚔️ <tspan fill="#00ff66" font-weight="bold">VAPT &amp; OFFENSIVE RED TEAMING</tspan>
      </text>
      <text x="0" y="38" fill="#a0aec0">
        ⚡ <tspan fill="#00e5ff" font-weight="bold">EXPLOIT SYNTHESIS &amp; REVERSE ENGINEERING</tspan>
      </text>
      <text x="0" y="56" fill="#718096">
        🎯 MOTTO: <tspan fill="#ffffff" font-style="italic">"Code is my katana. Packets are my shuriken."</tspan>
      </text>
    </g>
  </g>

  <!-- Right: Radar Target Lock HUD -->
  <g transform="translate(770, 130)">
    <!-- Radar concentric rings -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.3" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="#00ff66" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ff0055" stroke-width="1" opacity="0.6" />
    <circle cx="0" cy="0" r="3" fill="#00ff66" class="hud-indicator" />

    <!-- Crosshairs -->
    <line x1="-54" y1="0" x2="54" y2="0" stroke="#00e5ff" stroke-width="0.8" opacity="0.4" />
    <line x1="0" y1="-54" x2="0" y2="54" stroke="#00e5ff" stroke-width="0.8" opacity="0.4" />

    <!-- Rotating Radar Sweep Line -->
    <g class="radar-sweep">
      <line x1="0" y1="0" x2="48" y2="0" stroke="url(#cyber-neon)" stroke-width="2.5" />
      <polygon points="0,0 48,-14 48,0" fill="#00ff66" opacity="0.15" />
    </g>

    <!-- Compass ticks -->
    <text x="-4" y="-56" font-family="monospace" font-size="8" fill="#00ff66" opacity="0.7">N</text>
    <text x="56" y="3" font-family="monospace" font-size="8" fill="#00e5ff" opacity="0.7">E</text>
    <text x="-4" y="64" font-family="monospace" font-size="8" fill="#00ff66" opacity="0.7">S</text>
    <text x="-66" y="3" font-family="monospace" font-size="8" fill="#00e5ff" opacity="0.7">W</text>
    <text x="-26" y="44" font-family="monospace" font-size="7.5" fill="#00ff66">TARGET_LOCK</text>
  </g>

  <!-- Corner Tactical Brackets -->
  <g stroke="#00ff66" stroke-width="2.5" fill="none" class="corner-pulse">
    <!-- Top Left -->
    <path d="M 12 28 L 12 12 L 28 12" />
    <!-- Top Right -->
    <path d="M 852 12 L 868 12 L 868 28" />
    <!-- Bottom Left -->
    <path d="M 12 232 L 12 248 L 28 248" />
    <!-- Bottom Right -->
    <path d="M 852 248 L 868 248 L 868 232" />
  </g>

  <!-- Animated Green Laser Scanline (Passes over whole card) -->
  <g class="scanline-bar">
    <rect x="4" y="0" width="872" height="18" fill="url(#green-scan)" opacity="0.7" />
    <line x1="4" y1="9" x2="876" y2="9" stroke="#00ff66" stroke-width="1.2" opacity="0.85" filter="url(#eye-flare)" />
  </g>
</svg>