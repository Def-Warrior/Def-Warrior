<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 24" width="100%" height="24">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0" />
      <stop offset="20%" stop-color="#00ff66" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#00ff66" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulse-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0" />
      <stop offset="50%" stop-color="#00ff66" stop-opacity="1" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>

    <filter id="div-glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseRunner {
        0% { transform: translateX(-200px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(880px); opacity: 0; }
      }
      @keyframes spinShuriken {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .beam-run {
        animation: pulseRunner 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .shuriken-center {
        transform-origin: 440px 12px;
        animation: spinShuriken 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Static Track Line -->
  <line x1="20" y1="12" x2="415" y2="12" stroke="url(#div-grad)" stroke-width="1.5" />
  <line x1="465" y1="12" x2="860" y2="12" stroke="url(#div-grad)" stroke-width="1.5" />

  <!-- Accent Ticks -->
  <line x1="60" y1="8" x2="60" y2="16" stroke="#00ff66" stroke-width="1" opacity="0.4" />
  <line x1="160" y1="8" x2="160" y2="16" stroke="#00e5ff" stroke-width="1" opacity="0.4" />
  <line x1="720" y1="8" x2="720" y2="16" stroke="#00e5ff" stroke-width="1" opacity="0.4" />
  <line x1="820" y1="8" x2="820" y2="16" stroke="#00ff66" stroke-width="1" opacity="0.4" />

  <!-- Running Pulse Beam -->
  <g class="beam-run">
    <rect x="0" y="10" width="120" height="4" rx="2" fill="url(#pulse-beam)" filter="url(#div-glow)" />
  </g>

  <!-- Center Shuriken Node -->
  <circle cx="440" cy="12" r="10" fill="#050811" stroke="#00ff66" stroke-width="1.5" />
  <g class="shuriken-center">
    <polygon points="440,5 442,10 447,12 442,14 440,19 438,14 433,12 438,10" fill="#00e5ff" filter="url(#div-glow)" />
  </g>
</svg>