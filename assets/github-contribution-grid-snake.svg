<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="100%" height="160">
  <defs>
    <style>
      @keyframes snakeMove {
        0% { transform: translate(0, 0); }
        25% { transform: translate(160px, 0); }
        50% { transform: translate(160px, 45px); }
        75% { transform: translate(320px, 45px); }
        100% { transform: translate(0, 0); }
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #00ff66); }
      }
      .snake-head {
        fill: #00ff66;
        filter: drop-shadow(0 0 6px #00ff66);
      }
      .snake-body {
        fill: #00e5ff;
        filter: drop-shadow(0 0 4px #00e5ff);
      }
      .snake-crawler {
        animation: snakeMove 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .grid-dot {
        rx: 3px;
        transition: all 0.3s;
      }
      .active-1 { fill: #004d20; }
      .active-2 { fill: #008f39; }
      .active-3 { fill: #00cc4c; }
      .active-4 { fill: #00ff66; animation: dotPulse 3s infinite; }
    </style>
  </defs>

  <!-- Background Container -->
  <rect width="880" height="160" rx="10" fill="#090d16" stroke="#00ff66" stroke-width="1" stroke-opacity="0.3" />

